<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Frete Módico Correios</title>
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 400px;
      margin: 30px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-shadow: 2px 2px 12px rgba(0, 0, 0, 0.1);
    }

    .cabecalho {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #eee;
    }

    .cabecalho img {
      width: 64px;
      height: 64px;
      flex-shrink: 0;
    }

    h2 {
      margin: 0;
      color: #2c3e50;
      font-size: 1.3em;
      line-height: 1.3;
    }

    .campo {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .resultado {
      margin-top: 20px;
      padding: 10px;
      background-color: #f0f8ff;
      border-left: 5px solid #007bff;
      border-radius: 4px;
    }

    .resultado.erro {
      background-color: #fff0f0;
      border-left-color: #dc3545;
    }

    .resultado input {
      font-size: 1.2em;
      font-weight: bold;
      color: #2c3e50;
      background-color: #e9ecef;
      border: none;
    }

    .resultado.erro input {
      color: #dc3545;
    }

    .rodape {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      font-size: 0.85em;
      color: #555;
    }

    .rodape a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #2c3e50;
      text-decoration: none;
      font-weight: bold;
    }

    .rodape a:hover {
      color: #007bff;
      text-decoration: underline;
    }

    .rodape svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="cabecalho">
    <img src="logo.png" alt="Logo Modico" width="64" height="64">
    <h2>Calculadora de Frete Módico Correios</h2>
  </div>

  <div class="campo">
    <label for="pesoLivro">Peso do livro (g):</label>
    <input type="number" id="pesoLivro" placeholder="Ex: 500" min="0">
  </div>

  <div class="campo">
    <label for="pesoEmbalagem">Peso da embalagem (g):</label>
    <input type="number" id="pesoEmbalagem" value="20" min="0">
  </div>

  <div class="campo resultado" id="resultado">
    <label for="valorTotal">Valor total do frete:</label>
    <input type="text" id="valorTotal" readonly value="R$ 0,00">
  </div>

  <div class="rodape">
    <a href="https://github.com/andguerreiro/modico" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      Código aberto no GitHub
    </a>
  </div>

  <script>
    const PESO_MAXIMO = 2000;
    const TAXA_REGISTRO_MODICO = 4.05;

    // Tabela de preços de Impresso Normal [pesoMaximo, preco]
    const TABELA_PRECOS = [
      [20, 1.80],   [50, 2.60],   [100, 3.40],  [150, 4.15],
      [200, 4.95],  [250, 5.65],  [300, 6.50],  [350, 7.20],
      [400, 8.05],  [450, 8.85],  [500, 9.65],  [550, 10.20],
      [600, 11.00], [650, 11.65], [700, 12.25], [750, 12.85],
      [800, 13.55], [850, 14.25], [900, 15.10], [950, 15.75],
      [1000, 16.35]
    ];

    const inputLivro = document.getElementById('pesoLivro');
    const inputEmbalagem = document.getElementById('pesoEmbalagem');
    const inputValorTotal = document.getElementById('valorTotal');
    const containerResultado = document.getElementById('resultado');

    function formatarMoeda(valor) {
      return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(valor);
    }

    function obterPrecoImpressoNormal(peso) {
      if (peso <= 0) return 0;

      const faixa = TABELA_PRECOS.find(([limite]) => peso <= limite);
      if (faixa) return faixa[1];

      const pesoExcedente = peso - 1000;
      const fracoesAdicionais = Math.ceil(pesoExcedente / 1000);
      return 16.35 + (fracoesAdicionais * 6.60);
    }

    function calcularFrete() {
      const pesoLivro = parseFloat(inputLivro.value) || 0;
      const pesoEmbalagem = parseFloat(inputEmbalagem.value) || 0;

      if (pesoLivro <= 0) {
        inputValorTotal.value = formatarMoeda(0);
        containerResultado.classList.remove('erro');
        return;
      }

      const pesoTotal = pesoLivro + pesoEmbalagem;

      if (pesoTotal > PESO_MAXIMO) {
        inputValorTotal.value = "ERRO: limite de 2kg excedido";
        containerResultado.classList.add('erro');
        return;
      }

      containerResultado.classList.remove('erro');

      const custoImpresso = obterPrecoImpressoNormal(pesoTotal);
      const valorFinal = custoImpresso + TAXA_REGISTRO_MODICO;

      inputValorTotal.value = formatarMoeda(valorFinal);
    }

    // Event Listeners
    inputLivro.addEventListener('input', calcularFrete);
    inputEmbalagem.addEventListener('input', calcularFrete);

    // Executa ao carregar a página
    document.addEventListener('DOMContentLoaded', calcularFrete);
  </script>
</body>
</html>
