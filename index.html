<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Frete Modico</title>
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 400px;
      margin: 30px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-shadow: 2px 2px 12px rgba(0, 0, 0, 0.1);
    }

    h2 {
      margin-top: 0;
      color: #2c3e50;
    }

    .campo {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .resultado {
      margin-top: 20px;
      padding: 10px;
      background-color: #f0f8ff;
      border-left: 5px solid #007bff;
      border-radius: 4px;
    }

    .resultado.erro {
      background-color: #fff0f0;
      border-left-color: #dc3545;
    }

    .resultado input {
      font-size: 1.2em;
      font-weight: bold;
      color: #2c3e50;
      background-color: #e9ecef;
      border: none;
    }

    .resultado.erro input {
      color: #dc3545;
    }
  </style>
</head>
<body>

  <h2>Calculadora de Frete Modico</h2>

  <div class="campo">
    <label for="pesoLivro">Peso do livro (g):</label>
    <input type="number" id="pesoLivro" placeholder="Ex: 500" min="0">
  </div>

  <div class="campo">
    <label for="pesoEmbalagem">Peso da embalagem (g):</label>
    <input type="number" id="pesoEmbalagem" value="20" min="0">
  </div>

  <div class="campo resultado" id="resultado">
    <label for="valorTotal">Valor total do frete:</label>
    <input type="text" id="valorTotal" readonly value="R$ 0,00">
  </div>

  <p style="text-align: center; margin-top: 20px; font-size: 0.85em;">
    <a href="https://github.com/andguerreiro/modico" target="_blank" rel="noopener noreferrer">Código aberto no GitHub</a>
  </p>

  <script>
    const PESO_MAXIMO = 2000;
    const TAXA_REGISTRO_MODICO = 4.05;

    // Tabela de preços de Impresso Normal [pesoMaximo, preco]
    const TABELA_PRECOS = [
      [20, 1.80],   [50, 2.60],   [100, 3.40],  [150, 4.15],
      [200, 4.95],  [250, 5.65],  [300, 6.50],  [350, 7.20],
      [400, 8.05],  [450, 8.85],  [500, 9.65],  [550, 10.20],
      [600, 11.00], [650, 11.65], [700, 12.25], [750, 12.85],
      [800, 13.55], [850, 14.25], [900, 15.10], [950, 15.75],
      [1000, 16.35]
    ];

    const inputLivro = document.getElementById('pesoLivro');
    const inputEmbalagem = document.getElementById('pesoEmbalagem');
    const inputValorTotal = document.getElementById('valorTotal');
    const containerResultado = document.getElementById('resultado');

    function formatarMoeda(valor) {
      return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(valor);
    }

    function obterPrecoImpressoNormal(peso) {
      if (peso <= 0) return 0;

      const faixa = TABELA_PRECOS.find(([limite]) => peso <= limite);
      if (faixa) return faixa[1];

      const pesoExcedente = peso - 1000;
      const fracoesAdicionais = Math.ceil(pesoExcedente / 1000);
      return 16.35 + (fracoesAdicionais * 6.60);
    }

    function calcularFrete() {
      const pesoLivro = parseFloat(inputLivro.value) || 0;
      const pesoEmbalagem = parseFloat(inputEmbalagem.value) || 0;

      if (pesoLivro <= 0) {
        inputValorTotal.value = formatarMoeda(0);
        containerResultado.classList.remove('erro');
        return;
      }

      const pesoTotal = pesoLivro + pesoEmbalagem;

      if (pesoTotal > PESO_MAXIMO) {
        inputValorTotal.value = "ERRO: limite de 2kg excedido";
        containerResultado.classList.add('erro');
        return;
      }

      containerResultado.classList.remove('erro');

      const custoImpresso = obterPrecoImpressoNormal(pesoTotal);
      const valorFinal = custoImpresso + TAXA_REGISTRO_MODICO;

      inputValorTotal.value = formatarMoeda(valorFinal);
    }

    // Event Listeners
    inputLivro.addEventListener('input', calcularFrete);
    inputEmbalagem.addEventListener('input', calcularFrete);

    // Executa ao carregar a página
    document.addEventListener('DOMContentLoaded', calcularFrete);
  </script>
</body>
</html>
